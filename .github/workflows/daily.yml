name: Daily DART Top3

on:
  schedule:
    # 매일 UTC 22:00 = 한국시간(KST) 07:00 실행
    - cron: "0 22 * * *"
  workflow_dispatch:  # GitHub 화면에서 수동으로도 실행 가능하게

permissions:
  contents: write

jobs:
  run-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 라이브러리 설치
        run: pip install requests

      - name: 스크립트 실행 (docs/ 결과 생성)
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python dart_top3.py

      - name: 추천 종목 검증 데이터 생성 (과거 추천 정확도)
        run: python build_verification_data.py

      - name: 닷홈으로 FTP 업로드
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./docs/
          server-dir: /hosting/sigg3298/html/

      - name: 결과 커밋 및 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --cached --quiet && echo "변경 없음" || git commit -m "docs: 일일 결과 업데이트 ($(date +'%Y-%m-%d'))"
          git push